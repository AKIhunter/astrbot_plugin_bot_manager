name: astrbot_plugin_usage_telemetry
display_name: Bot Manager 集成管理
short_desc: 模型与搜索计量、余额提醒和完整指令查询
desc: 统一采集模型与向量 Token、DeepSeek 搜索及抓取次数；余额与充值提醒可配置发送目标（QQ 私聊或群），并可在插件里直接配置 DeepSeek 余额密钥与面板登录密码（账号固定 admin）、自动下发到本机面板。内部标识保持兼容。
version: 2.2.1
author: Bot Manager
repo: https://github.com/AKIhunter/astrbot_plugin_bot_manager
astrbot_version: ">=4.29.0"
tags:
  - telemetry
  - token
  - cost
help: |
  Bot Manager · 指令帮助（仅管理员）
  /bm 或 /bm 帮助：查看指令表格图片

  【状态与余额】
  /bm 状态：查看采集和提醒状态
  /bm 余额：查询 DeepSeek 实时余额
  /bm 通知：查看余额提醒配置与发送目标
  /bm 通知 测试：立即向配置的目标发一条测试消息
  /bm 凭据：查看 DeepSeek 密钥与面板密码的同步状态
  /bm 凭据 同步：立即把配置里的凭据下发给面板

  【用量统计】
  /bm 用量 [时间]：调用、Token 和插件排行
  /bm 搜索 [时间]：搜索、抓取次数及费用
  时间：今天、昨天、7天、30天、全部

  【指令查询】
  /bm 指令 [关键词或插件名] [页码]
  /bm 详情 <完整指令名> [页码]
