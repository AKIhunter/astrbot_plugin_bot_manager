name: astrbot_plugin_usage_telemetry
display_name: Bot Manager 集成管理
short_desc: 模型与搜索计量、余额提醒和完整指令查询
desc: 统一采集模型与向量 Token、DeepSeek 搜索及抓取次数，保留余额与充值提醒，并提供 /botmanager 管理和服务器指令查询。内部标识保持兼容。
version: 2.0.0
author: Bot Manager
repo: https://github.com/AKIhunter/astrbot_plugin_bot_manager
astrbot_version: ">=4.29.0"
tags:
  - telemetry
  - token
  - cost
help: |
  /botmanager 或 /bm：查看全部管理指令（仅管理员）
  /bm 状态；/bm 余额；/bm 用量 [今天|昨天|7天|30天|全部]
  /bm 搜索 [今天|昨天|7天|30天|全部]
  /bm 指令 [关键词或插件名] [页码]
  /bm 详情 <完整指令名> [页码]
  /账户余额、/余额、/钱包 保持兼容。
